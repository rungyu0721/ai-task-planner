<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<title>手機版設計示意｜智慧任務規劃</title>
<link rel="stylesheet" href="../css/integration.css">
<script src="../integration.js" defer></script>
</head>
<body>
<p class="tp-demo-note">手機版設計示意 · 範例資料 · <a href="dashboard.html">返回系統首頁</a></p>
<div style="display:flex;gap:40px;padding:24px;justify-content:center;background:var(--bg)">
<div class="tp-phone" style="position:relative"><div class="tp-phone__top"><span>早安，容妤</span><span class="tp-brand__mark"></span></div>
<div class="tp-phone__body"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="tp-stat "><div class="tp-stat__label">總任務數</div><div class="tp-stat__num">24</div><div class="tp-stat__hint"></div></div><div class="tp-stat "><div class="tp-stat__label"><span class="tp-swatch" style="background:var(--status-done)"></span>已完成</div><div class="tp-stat__num">15</div><div class="tp-stat__hint"></div></div><div class="tp-stat "><div class="tp-stat__label"><span class="tp-swatch" style="background:var(--status-doing)"></span>未完成</div><div class="tp-stat__num">8</div><div class="tp-stat__hint"></div></div><div class="tp-stat tp-stat--overdue"><div class="tp-stat__label"><span class="tp-swatch" style="background:var(--status-overdue)"></span>逾期</div><div class="tp-stat__num">1</div><div class="tp-stat__hint"></div></div></div>
<section class="tp-card" style="padding:4px"><div class="tp-card__head" style="padding:12px 12px 0;margin-bottom:4px"><h2 class="tp-h2" style="font-size:16px">今天</h2><span class="tp-cap">3 件</span></div>
<div class="tp-task tp-task--overdue"><span class="tp-check"></span><div><div class="tp-task__title">整理期末專題需求文件</div><div class="tp-task__meta"><span class="tp-due">已逾期 1 天</span></div></div><div class="tp-task__side"><span class="tp-chip tp-chip--overdue">逾期</span><span class="tp-prio tp-prio--high">高</span></div></div><div class="tp-task tp-task--"><span class="tp-check"></span><div><div class="tp-task__title">資料清理</div><div class="tp-task__meta"><span class="tp-due">今天 23:59</span></div></div><div class="tp-task__side"><span class="tp-chip tp-chip--doing">進行中</span><span class="tp-prio tp-prio--high">高</span></div></div><div class="tp-task tp-task--"><span class="tp-check"></span><div><div class="tp-task__title">閱讀第 6 章並做筆記</div><div class="tp-task__meta"><span class="tp-due">今天</span></div></div><div class="tp-task__side"><span class="tp-prio tp-prio--mid">中</span></div></div></section></div>
<span class="tp-fab">＋</span>
<nav class="tp-bnav"><a href="dashboard.html" class="on"><span class="tp-nav__ico"></span>首頁</a><a><span class="tp-nav__ico"></span>目標</a><a><span class="tp-nav__ico"></span>分析</a><a><span class="tp-nav__ico"></span>設定</a></nav></div>
<div class="tp-phone"><div class="tp-phone__top"><span>‹ AI 任務草稿</span><span class="tp-chip tp-chip--ai"><span class="tp-ai-dot"></span>草稿</span></div>
<div class="tp-phone__body">
<div class="tp-card" style="padding:12px 14px"><div class="tp-row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tp-task__title">確認報告格式與評分標準</span><span class="tp-prio tp-prio--high">高</span></div><div class="tp-task__meta">10/24 · 30 分</div></div><div class="tp-card" style="padding:12px 14px"><div class="tp-row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tp-task__title">挑選公開資料集</span><span class="tp-prio tp-prio--high">高</span></div><div class="tp-task__meta">10/26 · 90 分</div></div><div class="tp-card" style="padding:12px 14px"><div class="tp-row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tp-task__title">資料清理</span><span class="tp-prio tp-prio--high">高</span></div><div class="tp-task__meta">11/02 · 240 分</div></div><div class="tp-card" style="padding:12px 14px"><div class="tp-row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tp-task__title">探索性分析</span><span class="tp-prio tp-prio--mid">中</span></div><div class="tp-task__meta">11/06 · 180 分</div></div><div class="tp-card" style="padding:12px 14px"><div class="tp-row" style="justify-content:space-between;flex-wrap:nowrap"><span class="tp-task__title">建立分析模型</span><span class="tp-prio tp-prio--mid">中</span></div><div class="tp-task__meta">11/11 · 240 分</div></div></div>
<div style="padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)"><button class="tp-btn tp-btn--primary" style="width:100%;justify-content:center;height:44px">確認並儲存 8 個任務</button></div></div>
</div>
</body>
</html>
