<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<title>目標詳情｜智慧任務規劃</title>
<link rel="stylesheet" href="../css/integration.css">
<link rel="stylesheet" href="../css/app.css">
<script src="../integration.js" defer></script>
<script type="module" src="../js/goal-detail.js"></script>
</head>
<body>
<nav class="tp-mobile-nav" aria-label="手機版主要導覽"><a href="dashboard.html">首頁</a><a href="goals.html" aria-current="page">我的目標</a><a href="progress.html">進度分析</a><a href="new-goal.html">新增目標</a></nav>
<div class="tp-shell"><aside class="tp-side"><div class="tp-brand"><span class="tp-brand__mark"></span>智慧任務規劃</div>
<nav class="tp-nav"><a href="dashboard.html" class=""><span class="tp-nav__ico"></span>首頁</a><a href="goals.html" class="on"><span class="tp-nav__ico"></span>我的目標</a><a href="progress.html" class=""><span class="tp-nav__ico"></span>進度分析</a><a href="#" class=""><span class="tp-nav__ico"></span>設定</a></nav>
<div class="tp-side__foot"><a href="new-goal.html" class="tp-btn tp-btn--primary" style="width:100%;justify-content:center;text-decoration:none"><span class="tp-ai-dot"></span>新增目標</a></div></aside>
<main class="tp-main"><div class="tp-wrap">
<div id="load-error" class="tp-alert tp-alert--error" hidden></div>
<section class="tp-card" id="goal-header"><p class="tp-cap" style="margin:0 0 4px"><a href="goals.html" class="app-link">我的目標</a> / 目標詳情</p>
<div class="tp-pagehead" style="align-items:flex-start"><div><h1 class="tp-h1" id="goal-title">載入中…</h1><p class="tp-sm tp-muted" style="margin:4px 0 0" id="goal-meta"></p><p class="tp-sm" style="margin:8px 0 0;white-space:pre-line" id="goal-description"></p></div>
<div class="tp-row"><button type="button" class="tp-btn tp-btn--sm" data-action="edit-goal">編輯目標</button><button type="button" class="tp-btn tp-btn--danger tp-btn--sm" data-action="delete-goal">刪除目標</button></div></div>
<div class="tp-row" style="margin-top:16px;gap:16px;flex-wrap:nowrap"><div class="tp-bar" style="flex:1"><i id="goal-bar" style="width:0%"></i></div><span class="tp-sm app-num" id="goal-progress">0 / 0 · 0%</span></div></section>
<div class="tp-row" style="justify-content:space-between">
<div class="tp-tabs" id="status-tabs" role="tablist"></div>
<button type="button" class="tp-btn tp-btn--primary tp-btn--sm" data-action="add-task">＋ 新增任務</button></div>
<section class="tp-card" style="padding:8px" id="task-list" aria-live="polite"></section>
</div></main></div>

<dialog id="task-dialog" class="app-dialog"><form class="tp-col" style="gap:16px" novalidate>
<h2 class="tp-h2" id="task-dialog-title">新增任務</h2>
<div class="tp-field"><label class="tp-field__label" for="task-title">任務名稱 <span style="color:var(--status-overdue)">*</span></label><input id="task-title" name="title" class="tp-input" maxlength="200" required></div>
<div class="tp-field"><label class="tp-field__label" for="task-description">說明</label><textarea id="task-description" name="description" class="tp-input tp-input--area" maxlength="10000"></textarea></div>
<div class="app-form-grid">
<div class="tp-field" id="task-status-field"><label class="tp-field__label" for="task-status">狀態</label><select id="task-status" name="status" class="tp-input"><option value="todo">待辦</option><option value="in_progress">進行中</option><option value="completed">已完成</option></select></div>
<div class="tp-field"><label class="tp-field__label" for="task-priority">優先級</label><select id="task-priority" name="priority" class="tp-input"><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></div>
<div class="tp-field"><label class="tp-field__label" for="task-due">截止日期</label><input id="task-due" name="due_date" type="date" class="tp-input"></div>
<div class="tp-field"><label class="tp-field__label" for="task-minutes">預估時間（分鐘）</label><input id="task-minutes" name="estimated_minutes" type="number" min="1" step="1" class="tp-input"></div>
</div>
<div class="tp-row" style="justify-content:flex-end"><button type="button" class="tp-btn tp-btn--ghost" data-close>取消</button><button type="submit" class="tp-btn tp-btn--primary">儲存</button></div>
</form></dialog>
<dialog id="goal-dialog" class="app-dialog"><form class="tp-col" style="gap:16px" novalidate>
<h2 class="tp-h2">編輯目標</h2>
<div class="tp-field"><label class="tp-field__label" for="edit-goal-title">目標名稱 <span style="color:var(--status-overdue)">*</span></label><input id="edit-goal-title" name="title" class="tp-input" maxlength="200" required></div>
<div class="tp-field"><label class="tp-field__label" for="edit-goal-description">目標說明</label><textarea id="edit-goal-description" name="description" class="tp-input tp-input--area" maxlength="10000"></textarea></div>
<div class="app-form-grid">
<div class="tp-field"><label class="tp-field__label" for="edit-goal-date">希望完成日期</label><input id="edit-goal-date" name="target_date" type="date" class="tp-input"></div>
<div class="tp-field"><label class="tp-field__label" for="edit-goal-hours">每週可用時間（小時）</label><input id="edit-goal-hours" name="weekly_hours" type="number" min="1" max="168" step="1" class="tp-input"></div>
</div>
<div class="tp-row" style="justify-content:flex-end"><button type="button" class="tp-btn tp-btn--ghost" data-close>取消</button><button type="submit" class="tp-btn tp-btn--primary">儲存</button></div>
</form></dialog>
</body>
</html>
