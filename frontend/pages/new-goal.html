<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/style.css">
<title>新增目標｜智慧任務規劃</title>
<link rel="stylesheet" href="../css/integration.css">
<link rel="stylesheet" href="../css/app.css">
<script src="../integration.js" defer></script>
<script type="module" src="../js/new-goal.js"></script>
</head>
<body>
<nav class="tp-mobile-nav" aria-label="手機版主要導覽"><a href="dashboard.html">首頁</a><a href="goals.html" aria-current="page">我的目標</a><a href="progress.html">進度分析</a><a href="new-goal.html">新增目標</a></nav>
<div class="tp-shell"><aside class="tp-side"><div class="tp-brand"><span class="tp-brand__mark"></span>智慧任務規劃</div>
<nav class="tp-nav"><a href="dashboard.html" class=""><span class="tp-nav__ico"></span>首頁</a><a href="goals.html" class="on"><span class="tp-nav__ico"></span>我的目標</a><a href="progress.html" class=""><span class="tp-nav__ico"></span>進度分析</a><a href="#" class=""><span class="tp-nav__ico"></span>設定</a></nav>
<div class="tp-side__foot"><a href="new-goal.html" class="tp-btn tp-btn--primary" style="width:100%;justify-content:center;text-decoration:none"><span class="tp-ai-dot"></span>新增目標</a></div></aside>
<main class="tp-main"><div class="tp-wrap">
<div><p class="tp-cap" style="margin:0 0 4px">我的目標 / 新增目標</p><h1 class="tp-h1">新增目標</h1><p class="tp-muted" style="margin:4px 0 0">寫下你想完成的事，AI 會先幫你拆成任務草稿，你確認後才會儲存。</p></div>
<div class="tp-grid-side">
<form id="goal-form" class="tp-card tp-col" style="gap:20px;max-width:var(--form-max)" novalidate>
<div class="tp-field"><label class="tp-field__label" for="goal-title">目標名稱 <span style="color:var(--status-overdue)">*</span></label><input id="goal-title" name="title" class="tp-input" maxlength="200" required placeholder="例如：四週內完成資料分析課程期末專題"><span id="title-error" class="tp-err" hidden>請輸入目標名稱</span></div>
<div class="tp-field"><label class="tp-field__label" for="goal-description">目標說明</label><textarea id="goal-description" name="description" class="tp-input tp-input--area" maxlength="10000" placeholder="例如：要用公開資料集做分析，最後交一份報告和 10 分鐘簡報。"></textarea><span class="tp-field__hint">寫得越具體，AI 拆出來的任務越準。</span></div>
<div class="tp-row" style="gap:16px;align-items:flex-start"><div class="tp-field" style="flex:1"><label class="tp-field__label" for="goal-date">希望完成日期</label><input id="goal-date" name="target_date" type="date" class="tp-input"></div>
<div class="tp-field" style="flex:1"><label class="tp-field__label" for="goal-hours">每週可用時間（小時，選填）</label><input id="goal-hours" name="weekly_hours" type="number" min="1" max="168" step="1" class="tp-input" placeholder="例如：8"></div></div>
<div class="tp-row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px"><button type="reset" class="tp-btn tp-btn--ghost">清除</button>
<div class="tp-row"><button type="submit" class="tp-btn">不用 AI，手動建立</button><button type="button" id="ai-button" class="tp-btn tp-btn--primary"><span class="tp-ai-dot"></span>AI 幫我拆解</button></div></div>
</form>
<aside class="tp-col" style="gap:16px">
<section class="tp-card tp-card--ai"><h2 class="tp-h2" style="font-size:15px;margin-bottom:8px">AI 會做什麼？</h2><ul class="tp-sm" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>把目標拆成 5～12 個任務</li><li>依順序排好，並建議優先級</li><li>有填期限時，才會建議每個任務的日期</li><li>列出它做的假設，讓你檢查</li></ul></section>
<section class="tp-card"><h2 class="tp-h2" style="font-size:15px;margin-bottom:8px">範例</h2><p class="tp-sm tp-muted" style="margin:0">「研究所推甄：11 月底前完成讀書計畫、自傳與推薦信」</p></section>
</aside></div></div></main></div>
</body>
</html>
